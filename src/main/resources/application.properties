## JPA

# Compara las entidades contra el esquema real al arrancar y falla si no coinciden.
# El esquema lo crean los scripts de database/, Hibernate nunca lo modifica.
spring.jpa.hibernate.ddl-auto=validate

# Por defecto Spring Boot convierte los nombres a snake_case aunque esten puestos
# a mano en @Column, asi que fechaCompra pasaba a buscarse como fecha_compra.
# Esta estrategia respeta los nombres tal cual estan declarados.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl