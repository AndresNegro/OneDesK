## DATABASE CONFIGURATION

spring.datasource.url=jdbc:mysql://localhost:3306/onedesk
spring.datasource.username=OneDesK_user
# La contraseña no se versiona: se lee de db-local.properties, en la raiz del proyecto y en .gitignore
spring.config.import=optional:file:db-local.properties
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## JPA

# Compara las entidades contra el esquema real al arrancar y falla si no coinciden.
# El esquema lo crean los scripts de database/, Hibernate nunca lo modifica.
spring.jpa.hibernate.ddl-auto=validate

# Por defecto Spring Boot convierte los nombres a snake_case aunque esten puestos
# a mano en @Column, asi que fechaCompra pasaba a buscarse como fecha_compra.
# Esta estrategia respeta los nombres tal cual estan declarados.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
## GENERACION DE EVENTOS

# Cada cuanto se revisan las plantas para crear sus eventos: cada 5 minutos, en el segundo 0. Cron de Spring: segundos minutos horas dia mes dia-de-la-semana
onedesk.eventos.cron=0 */5 * * * *
# En false no se programa la revision (lo usa el test que levanta la aplicacion completa)
onedesk.eventos.activo=true
