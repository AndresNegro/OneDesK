<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
<title th:text="#{pagina.registro}">Crear cuenta</title>
</head>
<body>

<th:block layout:fragment="contenido">

<main class="acceso">

    <section th:replace="~{fragmentos :: fotoDeAcceso('/img/chalas-violeta.jpg', '50% 55%',
             #{registro.etiqueta.foto}, #{registro.titulo.foto}, #{registro.bajada.foto})}"></section>

    <section class="acceso__formulario">
        <div>
            <div th:replace="~{fragmentos :: idiomaSuelto}"></div>

            <p class="etiqueta mb-3" th:text="#{registro.etiqueta}">Cuenta nueva</p>
            <h2 class="display-6 mb-2" th:text="#{registro.titulo}">Pedir una cuenta</h2>
            <p class="apagado mb-4" th:text="#{registro.bajada}">La administración revisa cada solicitud antes de habilitarla.</p>

            <div th:replace="~{fragmentos :: avisos}"></div>

            <form th:action="@{/registro}" method="post" th:object="${form}">
                <div class="row g-3">
                    <div class="col-sm-6">
                        <label for="nombre" class="form-label" th:text="#{campo.nombre}">Nombre</label>
                        <input type="text" class="form-control" th:field="*{nombre}" required>
                    </div>

                    <div class="col-sm-6">
                        <label for="apellido" class="form-label" th:text="#{campo.apellido}">Apellido</label>
                        <input type="text" class="form-control" th:field="*{apellido}" required>
                    </div>

                    <div class="col-12">
                        <label for="email" class="form-label" th:text="#{campo.email}">Email</label>
                        <input type="email" class="form-control" th:field="*{email}"
                               th:placeholder="#{campo.email.ejemplo}" required>
                        <div class="form-text" th:text="#{registro.email.ayuda}">No puede estar registrado por otra persona.</div>
                    </div>

                    <div class="col-sm-6">
                        <label for="contrasenia" class="form-label" th:text="#{campo.contrasenia}">Contraseña</label>
                        <input type="password" class="form-control" th:field="*{contrasenia}"
                               minlength="5" required>
                        <div class="form-text" th:text="#{registro.contrasenia.ayuda}">Al menos 5 caracteres.</div>
                    </div>

                    <div class="col-sm-6">
                        <label for="repetir" class="form-label" th:text="#{registro.repetir}">Repetila</label>
                        <input type="password" class="form-control" th:field="*{repetir}"
                               minlength="5" required>
                    </div>
                </div>

                <div class="aviso mt-4 mb-4">
                    <i class="bi bi-envelope"></i>
                    <p class="mb-0 apagado small" th:text="#{registro.aviso}">
                        Tu cuenta queda pendiente hasta que la administración la apruebe.
                    </p>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100" th:text="#{registro.boton}">Pedir cuenta</button>
            </form>

            <p class="mt-4 mb-0 apagado">
                <span th:text="#{registro.con.cuenta}">¿Ya tenés cuenta?</span>
                <a th:href="@{/}" th:text="#{registro.ingresa}">Ingresá</a>
            </p>
        </div>
    </section>

</main>

</th:block>

</body>
</html>
