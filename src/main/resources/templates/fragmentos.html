<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- Partes que se repiten en todas las paginas. Cada pagina las incluye con th:replace. -->
<head th:fragment="cabeza(titulo)">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${titulo} + ' · OneDesK'">OneDesK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link th:href="@{/css/onedesk.css}" rel="stylesheet">
</head>
<body>

<!-- menu del usuario: activo es catalogo, compras o carrito -->
<nav th:fragment="menuUsuario(activo)" class="navbar navbar-expand-lg navbar-od">
    <div class="container">
        <a class="navbar-brand" th:href="@{/catalogo}">OneDesK</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto ms-lg-4">
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'catalogo'} ? 'active'" th:href="@{/catalogo}">Catálogo</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'compras'} ? 'active'" th:href="@{/mis-compras}">Mis compras</a></li>
            </ul>
            <ul class="navbar-nav align-items-lg-center">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activo == 'carrito'} ? 'active'" th:href="@{/carrito}">
                        <i class="bi bi-bag"></i> Carrito
                        <span class="contador" th:if="${enCarrito != null and enCarrito > 0}" th:text="${enCarrito}">2</span>
                    </a>
                </li>
                <li class="nav-item" th:replace="~{fragmentos :: salir}"></li>
            </ul>
        </div>
    </div>
</nav>

<!-- menu del empleado y del administrador: solo su panel y salir -->
<nav th:fragment="menuPanel(titulo, inicio)" class="navbar navbar-expand-lg navbar-od">
    <div class="container">
        <a class="navbar-brand" th:href="@{${inicio}}">OneDesK</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto ms-lg-4">
                <li class="nav-item"><a class="nav-link active" aria-current="page" th:href="@{${inicio}}" th:text="${titulo}">Panel</a></li>
            </ul>
            <ul class="navbar-nav align-items-lg-center">
                <li class="nav-item" th:replace="~{fragmentos :: salir}"></li>
            </ul>
        </div>
    </div>
</nav>

<!-- salir cierra la sesion: va por POST para que un link suelto no la cierre -->
<li th:fragment="salir" class="nav-item">
    <form th:action="@{/salir}" method="post" class="m-0">
        <button type="submit" class="nav-link btn btn-link">Salir</button>
    </form>
</li>

<!-- el resultado de la ultima accion: exito en verde, error en rosa -->
<div th:fragment="avisos">
    <div class="aviso-accion aviso-accion--exito" th:if="${exito}" role="status">
        <i class="bi bi-check-circle"></i><span th:text="${exito}">Listo</span>
    </div>
    <div class="aviso-accion aviso-accion--error" th:if="${error}" role="alert">
        <i class="bi bi-exclamation-circle"></i><span th:text="${error}">Algo salió mal</span>
    </div>
</div>

<th:block th:fragment="scripts">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
