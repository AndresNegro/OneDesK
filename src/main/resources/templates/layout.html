<!doctype html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<!--
El esqueleto de todas las paginas: la cabeza, el menu, el contenido y los scripts.
Cada pagina se declara con layout:decorate="~{layout}" y solo escribe lo suyo:
su <title>, su menu (layout:fragment="menu") y su contenido (layout:fragment="contenido").
El titulo de la pagina se junta con el de acá: "Catálogo" queda como "Catálogo · OneDesK".
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title layout:title-pattern="$CONTENT_TITLE · $LAYOUT_TITLE">OneDesK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link th:href="@{/css/onedesk.css}" rel="stylesheet">
</head>
<body>

<!-- las paginas de ingresar y registrarse no lo reemplazan: ahí no hay menu -->
<th:block layout:fragment="menu"></th:block>

<th:block layout:fragment="contenido"></th:block>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- el javascript propio de una pagina, como los modales del panel de administracion -->
<th:block layout:fragment="scripts"></th:block>

</body>
</html>
