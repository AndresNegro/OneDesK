<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
<title th:text="#{pagina.catalogo}">Catálogo</title>
</head>
<body>

<th:block layout:fragment="menu">
<nav th:replace="~{fragmentos :: menuUsuario('catalogo')}"></nav>
</th:block>

<th:block layout:fragment="contenido">

<header th:replace="~{fragmentos :: portada('', '/img/cogollo-tricomas.jpg', '50% 30%', #{catalogo.etiqueta},
        #{catalogo.titulo}, #{catalogo.bajada(${limites.minimoGramos}, ${limites.maximoGramos}, ${productos.size()})})}"></header>

<main class="container pb-5">

    <div class="mt-4" th:replace="~{fragmentos :: avisos}"></div>

    <form class="row g-2 mb-5 mt-1" th:action="@{/catalogo}" method="get">
        <div class="col-12 col-md-6">
            <label for="busqueda" class="visually-hidden" th:text="#{catalogo.buscar.label}">Buscar por genética</label>
            <div class="input-group">
                <span class="input-group-text border-end-0"><i class="bi bi-search"></i></span>
                <input type="search" class="form-control border-start-0" id="busqueda" name="busqueda"
                       th:value="${busqueda}" th:placeholder="#{catalogo.buscar.ejemplo}">
            </div>
        </div>
        <div class="col-8 col-md-4">
            <label for="orden" class="visually-hidden" th:text="#{catalogo.ordenar}">Ordenar</label>
            <select class="form-select" id="orden" name="orden">
                <option value="genetica" th:selected="${orden != 'precio'}" th:text="#{catalogo.orden.genetica}">Ordenar por genética</option>
                <option value="precio" th:selected="${orden == 'precio'}" th:text="#{catalogo.orden.precio}">Precio: de menor a mayor</option>
            </select>
        </div>
        <div class="col-4 col-md-2 d-grid">
            <button type="submit" class="btn btn-outline-primary" th:text="#{catalogo.buscar}">Buscar</button>
        </div>
    </form>

    <p class="apagado" th:if="${productos.isEmpty()}">
        <span th:text="#{catalogo.vacio}">No hay genéticas con stock</span><span th:if="${busqueda}" th:text="#{catalogo.vacio.busqueda(${busqueda})}"></span>.
    </p>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4">
        <div class="col" th:each="p : ${productos}">
            <article class="producto">
                <div class="producto__cuerpo">
                    <p class="producto__stock mb-4" th:text="#{catalogo.stock(${p.stock})}">12 g en stock</p>
                    <h2 class="producto__nombre" th:text="${p.genetica}">OG Kush</h2>
                    <p class="producto__precio mb-3" th:text="#{catalogo.precio(${#numbers.formatInteger(p.precio, 1, 'POINT')})}">$1.000 el gramo</p>
                    <div class="medidor mb-4"><span th:style="'width: ' + ${p.stock * 100 / stockMaximo} + '%;'"></span></div>
                    <form class="mt-auto d-flex gap-2" th:action="@{/carrito/agregar}" method="post">
                        <input type="hidden" name="productoId" th:value="${p.id}">
                        <label th:for="'cantidad-' + ${p.id}" class="visually-hidden" th:text="#{gramos.de(${p.genetica})}">Gramos</label>
                        <input type="number" class="form-control" th:id="'cantidad-' + ${p.id}" name="cantidad"
                               value="1" min="1" th:max="${p.stock < limites.maximoGramos ? p.stock : limites.maximoGramos}" required>
                        <button type="submit" class="btn btn-primary flex-shrink-0" th:aria-label="#{catalogo.agregar(${p.genetica})}">
                            <i class="bi bi-bag-plus"></i>
                        </button>
                    </form>
                </div>
            </article>
        </div>
    </div>
</main>

</th:block>

</body>
</html>
