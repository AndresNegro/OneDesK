<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
<title th:text="#{pagina.compras}">Mis compras</title>
</head>
<body>

<th:block layout:fragment="menu">
<nav th:replace="~{fragmentos :: menuUsuario('compras')}"></nav>
</th:block>

<th:block layout:fragment="contenido">

<header th:replace="~{fragmentos :: portada('portada--baja', '/img/cogollo-negro.jpg', '50% 10%',
        ${usuario.nombre} + ' ' + ${usuario.apellido} + ' · ' + ${usuario.email}, #{compras.titulo}, null)}"></header>

<main class="container pb-5">

    <div class="mt-4" th:replace="~{fragmentos :: avisos}"></div>

    <div class="row row-cols-1 row-cols-md-3 g-4 mb-5 mt-1"
         th:with="deuda=${usuario.montoDeDeuda()}, tope=${usuario.topeCredito}">
        <div class="col">
            <div class="panel-destacado h-100 p-4">
                <p class="etiqueta mb-3" th:text="#{compras.deuda}">Deuda</p>
                <p class="dato-destacado mb-3" style="color: var(--violeta-suave);" th:text="'$' + ${#numbers.formatInteger(deuda, 1, 'POINT')}">$3.000</p>
                <div class="medidor"><span th:style="'width: ' + ${tope == 0 ? (deuda > 0 ? 100 : 0) : (deuda >= tope ? 100 : deuda * 100 / tope)} + '%;'"></span></div>
                <p class="apagado small mb-0 mt-2" th:if="${tope > 0}" th:text="#{compras.porcentaje.tope(${deuda * 100 / tope})}">30% de tu tope</p>
                <p class="apagado small mb-0 mt-2" th:if="${tope == 0}" th:text="#{compras.sin.tope}">Sin tope de crédito asignado</p>
            </div>
        </div>
        <div class="col" th:replace="~{fragmentos :: tarjeta(#{compras.tope}, '$' + ${#numbers.formatInteger(usuario.topeCredito, 1, 'POINT')}, null, null)}"></div>
        <div class="col" th:replace="~{fragmentos :: tarjeta(#{compras.disponible},
             '$' + ${#numbers.formatInteger(usuario.topeCredito > usuario.montoDeDeuda() ? usuario.topeCredito - usuario.montoDeDeuda() : 0, 1, 'POINT')},
             'var(--verde-suave)', null)}"></div>
    </div>

    <h2 class="titulo-bloque" th:text="#{compras.historial}">Historial</h2>

    <div class="card p-5 text-center" th:if="${compras.isEmpty()}">
        <p class="apagado mb-3" th:text="#{compras.vacio}">Todavía no hiciste ninguna compra.</p>
        <a th:href="@{/catalogo}" class="btn btn-primary align-self-center" th:text="#{carrito.ir.al.catalogo}">Ir al catálogo</a>
    </div>

    <div class="card" th:unless="${compras.isEmpty()}">
        <div class="table-responsive">
            <table class="table table-hover align-middle tabla-datos">
                <thead>
                    <tr>
                        <th scope="col" class="ps-4" th:text="#{tabla.compra}">Compra</th>
                        <th scope="col" th:text="#{tabla.fecha}">Fecha</th>
                        <th scope="col" th:text="#{tabla.geneticas}">Genéticas</th>
                        <th scope="col" class="text-end" th:text="#{tabla.total}">Total</th>
                        <th scope="col" th:text="#{tabla.estado}">Estado</th>
                        <th scope="col" class="pe-4"><span class="visually-hidden" th:text="#{tabla.acciones}">Acciones</span></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${compras}">
                        <th scope="row" class="ps-4 fw-normal apagado" th:text="'#' + ${c.id}">#14</th>
                        <td class="apagado" th:text="${#temporals.format(c.fechaCompra, 'dd/MM/yyyy')}">14/09/2026</td>
                        <td>
                            <span th:each="item, it : ${c.items}"
                                  th:text="${item.producto.genetica} + ' ' + ${item.cantidad} + ' g' + (${it.last} ? '' : ', ')">OG Kush 3 g</span>
                        </td>
                        <td class="text-end fw-semibold" th:text="'$' + ${#numbers.formatInteger(c.precio, 1, 'POINT')}">$3.000</td>
                        <td th:replace="~{fragmentos :: estadoDeCompra(${c})}"></td>
                        <td class="text-end pe-4 text-nowrap" th:if="${c.pendiente or (c.aprobada and !c.pagado)}">
                            <form th:action="@{/mis-compras/{id}/pagar(id=${c.id})}" method="post" class="d-inline" th:if="${c.aprobada}">
                                <button type="submit" class="btn btn-sm btn-primary" th:text="#{compras.pagar}">Pagar</button>
                            </form>
                            <form th:action="@{/mis-compras/{id}/anular(id=${c.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-primary" th:text="#{compras.anular}">Anular</button>
                            </form>
                        </td>
                        <td class="text-end pe-4 apagado small" th:if="${c.rechazada or c.pagado}">—</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <p class="apagado small mt-3 mb-0" th:text="#{compras.ayuda}">
        Cada pedido queda esperando que la administración lo apruebe.
    </p>
</main>

</th:block>

</body>
</html>
