<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
<title th:text="#{pagina.ingresar}">Ingresar</title>
</head>
<body>

<th:block layout:fragment="contenido">

<main class="acceso">

    <section th:replace="~{fragmentos :: fotoDeAcceso('/img/cogollo-negro.jpg', '50% 30%',
             #{ingresar.etiqueta.foto}, #{ingresar.titulo.foto}, #{ingresar.bajada.foto})}"></section>

    <section class="acceso__formulario">
        <div>
            <div th:replace="~{fragmentos :: idiomaSuelto}"></div>

            <p class="etiqueta mb-3" th:text="#{ingresar.etiqueta}">Bienvenido</p>
            <h2 class="display-6 mb-2" th:text="#{ingresar.titulo}">Ingresar</h2>
            <p class="apagado mb-4" th:text="#{ingresar.bajada}">Clientes, empleados y administración entran por acá.</p>

            <div th:replace="~{fragmentos :: avisos}"></div>

            <form th:action="@{/ingresar}" method="post" th:object="${form}">
                <div class="mb-4">
                    <label for="email" class="form-label" th:text="#{campo.email}">Email</label>
                    <input type="email" class="form-control form-control-lg" th:field="*{email}"
                           th:placeholder="#{campo.email.ejemplo}" required autofocus>
                </div>

                <div class="mb-5">
                    <label for="contrasenia" class="form-label" th:text="#{campo.contrasenia}">Contraseña</label>
                    <input type="password" class="form-control form-control-lg" th:field="*{contrasenia}" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">
                    <span th:text="#{ingresar.boton}">Ingresar</span> <i class="bi bi-arrow-right ms-1"></i>
                </button>
            </form>

            <p class="mt-4 mb-0 apagado">
                <span th:text="#{ingresar.sin.cuenta}">¿No tenés cuenta?</span>
                <a th:href="@{/registro}" th:text="#{ingresar.registrate}">Registrate</a>
            </p>
        </div>
    </section>

</main>

</th:block>

</body>
</html>
