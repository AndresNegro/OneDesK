<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar · OneDesK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/onedesk.css" rel="stylesheet">
</head>
<body>

<main class="acceso">

    <section class="acceso__foto">
        <img src="img/cogollo-negro.jpg" alt="" style="object-position: 50% 30%;">
        <p class="acceso__marca navbar-brand mb-0 fs-3">OneDesK</p>

        <div class="acceso__texto">
            <p class="etiqueta mb-4">Cultivo indoor</p>
            <h1 class="titulo-serif mb-4">
                Todo el indoor,<br>
                <em>bajo control.</em>
            </h1>
            <div class="cifras">
                <div>
                    <p class="dato-destacado mb-1">2</p>
                    <p class="apagado small mb-0">Indoors</p>
                </div>
                <div>
                    <p class="dato-destacado mb-1">14</p>
                    <p class="apagado small mb-0">Plantas en cultivo</p>
                </div>
                <div>
                    <p class="dato-destacado mb-1">6</p>
                    <p class="apagado small mb-0">Genéticas</p>
                </div>
            </div>
        </div>
    </section>

    <section class="acceso__formulario">
        <div>
            <p class="etiqueta mb-3">Bienvenido</p>
            <h2 class="display-6 mb-2">Ingresar</h2>
            <p class="apagado mb-5">Riego, luz y ventilación planta por planta, y el catálogo al día con cada cosecha.</p>

            <form action="#" method="post">
                <div class="mb-4">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control form-control-lg" id="email" name="email"
                           placeholder="nombre@dominio.com" required>
                </div>

                <div class="mb-5">
                    <label for="contrasenia" class="form-label">Contraseña</label>
                    <input type="password" class="form-control form-control-lg" id="contrasenia"
                           name="contrasenia" minlength="5" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">
                    Ingresar <i class="bi bi-arrow-right ms-1"></i>
                </button>
            </form>

            <p class="mt-4 mb-0 apagado">
                ¿No tenés cuenta? <a href="registro.html">Registrate</a>
            </p>

            <p class="nota-maqueta mt-5 mb-0">Maqueta de diseño · datos de ejemplo</p>
        </div>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
