<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar · OneDesK</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/onedesk.css" rel="stylesheet">
</head>
<body>

<main class="panel-acceso">
    <div class="w-100" style="max-width: 26rem;">

        <div class="text-center mb-4">
            <h1 class="marca-acceso h2 mb-1">OneDesK</h1>
            <p class="text-body-secondary mb-0">Gestión de cultivo indoor</p>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="h5 mb-3">Ingresar</h2>

                <form action="#" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email"
                               placeholder="nombre@dominio.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="contrasenia" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="contrasenia" name="contrasenia"
                               minlength="5" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                </form>
            </div>
        </div>

        <p class="text-center mt-3 mb-0">
            ¿No tenés cuenta? <a href="registro.html">Registrate</a>
        </p>

        <p class="text-center nota-maqueta mt-4 mb-0">Maqueta de diseño: los datos son de ejemplo.</p>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
