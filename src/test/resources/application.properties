## Configuracion solo para los tests

# Contra H2 en memoria el esquema lo genera Hibernate desde las entidades,
# asi que aca no se valida: se crea y se descarta en cada corrida.
spring.jpa.hibernate.ddl-auto=create-drop

# Misma estrategia que en produccion, para que los tests usen los mismos
# nombres de columna que la base real.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
