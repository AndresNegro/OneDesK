## BASE DE LOS TESTS

# Solo existe al correr los tests. Spring Boot lee el application.properties de la aplicacion y
# despues este, que pisa la URL: los tests usan onedesk_test y nunca tocan la base real onedesk.
# Asi los datos de prueba no gastan ids de la base real ni se mezclan con los datos de verdad.
# El resto de la configuracion (usuario, contrasenia, validate, nombres) es el mismo.
spring.datasource.url=jdbc:mysql://localhost:3306/onedesk_test
